<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江川大学图书馆</title>
<style>

/* ===== 江川大学图书馆 · 单文件门户 · 全局样式 ===== */
:root{
  --green:#1A4A3A;      /* 主色 墨绿 */
  --blue:#1B3A5C;       /* 辅色 深蓝 */
  --amber:#E8A838;      /* 强调 橙黄 */
  --bg:#F5F2EC;         /* 页面背景 浅米灰 */
  --card:#FFFFFF;
  --line:#D4DCD4;       /* 卡片边框 灰绿 */
  --text:#2C3A2C;
  --muted:#6B7A6B;
  --navtext:#F5F2EC;
  --footerbg:#0F2A1F;
  --foottext:#C5C9C5;
  --login:#29B6F6;
  --login-dark:#0288D1;
  --st-ok:#43A047;
  --st-out:#FB8C00;
  --st-lost:#E53935;
  --st-broken:#8E24AA;
  --input-line:#B8C4B8;
  --shadow:0 2px 4px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;border-radius:0 !important}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--text);background:var(--bg);line-height:1.7;font-size:1rem}
a{color:var(--green);text-decoration:none}
a:hover{color:var(--amber)}
img{max-width:100%;display:block}
h1{font-size:2.2rem;margin:0 0 12px;color:var(--green);line-height:1.3}
h2{font-size:1.8rem;margin:0 0 10px;color:var(--green);line-height:1.3}
h3{font-size:1.4rem;margin:0 0 8px;color:var(--green);line-height:1.3}
p{margin:0 0 14px}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* ===== 顶部导航 ===== */
.site-header{background:var(--green);border-bottom:3px solid var(--amber)}
.site-header .container{display:flex;align-items:center;height:64px;gap:28px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand__mark{width:38px;height:38px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;border:1px solid rgba(255,255,255,.25)}
.brand__name{color:var(--navtext);font-weight:700;font-size:1.05rem;white-space:nowrap}
.main-nav{display:flex;align-items:center;gap:0;flex:1;overflow-x:auto}
.main-nav a{color:var(--navtext);font-weight:500;font-size:1rem;padding:0 14px;height:64px;display:flex;align-items:center;position:relative;white-space:nowrap}
.main-nav a:hover{color:var(--amber)}
.main-nav a.active{color:var(--amber)}
.main-nav a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--amber)}
.nav-login{margin-left:auto;flex-shrink:0}
.btn-login{display:inline-flex;align-items:center;background:var(--login);color:#fff;padding:8px 20px;font-weight:600;font-size:.95rem}
.btn-login:hover{background:var(--login-dark);color:#fff}
.nav-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:var(--navtext);padding:6px 12px;font-size:1.1rem;cursor:pointer}

/* ===== 面包屑 ===== */
.breadcrumb{font-size:.88rem;color:var(--muted);padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:0}
.breadcrumb a{color:var(--muted)}
.breadcrumb a:hover{color:var(--green)}
.breadcrumb span{color:var(--green);font-weight:500}

/* ===== 内容布局 ===== */
main.container{padding:24px 20px 56px;min-height:60vh}
.page-title{border-left:5px solid var(--amber);padding-left:14px;margin-bottom:20px}
.page-title h1{margin:0}

/* 首页 hero */
.hero{background:var(--bg);padding:48px 0 40px;border-bottom:1px solid var(--line)}
.hero__inner{text-align:center;max-width:760px;margin:0 auto}
.hero__sub{color:var(--muted);font-size:1rem;margin-bottom:4px}
.hero__title{font-size:2.4rem;color:var(--green);margin:0 0 6px}
.hero__slogan{color:var(--blue);font-size:1.1rem;margin-bottom:24px}
.hero__search{display:flex;gap:0;max-width:640px;margin:0 auto 12px}
.hero__search input{flex:1}
.hero__links{font-size:.92rem}

/* 输入框 / 表单 */
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--input-line);padding:10px 14px;font-size:1rem;font-family:inherit;background:#fff;color:var(--text);width:100%
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:var(--green)}
label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;color:var(--text)}
.field{margin-bottom:16px}
.field .err{color:var(--st-lost);font-size:.85rem;margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--st-lost)}
.req{color:var(--st-lost)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;padding:10px 24px;font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--amber);color:#fff}
.btn-blue{background:var(--login)}
.btn-blue:hover{background:var(--login-dark);color:#fff}
.btn-ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn-ghost:hover{background:var(--green);color:#fff}
.btn-sm{padding:6px 16px;font-size:.92rem}
.btn-block{width:100%}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px}
.card h3{margin-top:0}

/* 网格 */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-6{grid-template-columns:repeat(6,1fr)}
.grid-8{grid-template-columns:repeat(8,1fr)}

/* 区块标题 */
.section-title{font-size:1.5rem;color:var(--green);margin:36px 0 16px;padding-left:12px;border-left:4px solid var(--amber)}

/* 快捷入口（首页，1:1 直角小卡） */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:460px;margin:0 auto}
.home-cols{display:grid;grid-template-columns:minmax(0,480px) 1fr;gap:32px;align-items:start}
.quick-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:1/1;text-align:center;transition:transform .15s}
.quick-card:hover{transform:translateY(-3px);border-color:var(--amber)}
.quick-card__icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--green)}
.quick-card__icon svg{width:34px;height:34px}
.quick-card__label{font-weight:600;color:var(--green);font-size:.95rem}

/* 二级页面布局：左侧导航 25% + 主内容 75% */
.layout{display:flex;gap:28px;align-items:flex-start}
.side{width:25%;flex-shrink:0}
.side-nav{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.side-nav__title{background:var(--green);color:#fff;font-weight:700;padding:14px 18px;font-size:1rem}
.side-nav a{display:block;padding:12px 18px;color:var(--text);border-bottom:1px solid var(--line);font-size:.95rem}
.side-nav a:last-child{border-bottom:none}
.side-nav a:hover{background:var(--bg);color:var(--green)}
.side-nav a.active{color:var(--amber);font-weight:700;background:#FBF7EF;border-left:3px solid var(--amber)}
.content{flex:1;min-width:0}
.content main.container{max-width:none;padding:0}

/* 筛选栏（馆藏资源左侧） */
.filter-group{margin-bottom:20px}
.filter-group h4{font-size:.95rem;color:var(--green);margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.filter-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.92rem;cursor:pointer}
.filter-item input{margin:0}

/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border:1px solid var(--line);padding:12px 16px;text-align:left;vertical-align:top}
th{background:var(--green);color:#fff;font-weight:600}
tbody tr:nth-child(even){background:#F8F6F2}
tbody tr:nth-child(odd){background:#FFFFFF}

/* 状态标签 */
.tag{display:inline-block;padding:2px 10px;font-size:.82rem;font-weight:600;color:#fff;line-height:1.5}
.tag-ok{background:var(--st-ok)}
.tag-out{background:var(--st-out)}
.tag-lost{background:var(--st-lost)}
.tag-broken{background:var(--st-broken)}
.tag-public{background:var(--st-ok)}
.tag-internal{background:var(--blue)}
.tag-restricted{background:var(--st-lost)}

/* 列表分隔线 */
.list-line{border-bottom:1px solid var(--line);padding:12px 0}
.list-line:last-child{border-bottom:none}

/* 图书卡片 */
.book{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:none}
.book__cover{width:84px;height:126px;background:#EAE6DC;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.78rem}
.book__info{flex:1;min-width:0}
.book__title{font-weight:700;color:var(--green);font-size:1.05rem}
.book__author{color:var(--blue);font-size:.92rem;margin:2px 0}
.book__meta{color:var(--muted);font-size:.85rem;margin:2px 0}
.book__row{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.book__borrower{color:var(--st-lost);font-size:.85rem;margin-top:4px;font-weight:600}

/* 新闻列表 */
.news-item{padding:14px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:none}
.news-item__date{color:var(--muted);font-size:.85rem}
.news-item__title{font-weight:600;color:var(--green)}
.news-item__summary{color:var(--text);font-size:.92rem;margin-top:4px}

/* 特藏条目 */
.special-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.special-item .code{font-family:Consolas,monospace;color:var(--blue);font-weight:600;flex-shrink:0}
.special-item .ttl{flex:1}
.special-item.locked{cursor:pointer}
.special-item.locked:hover .ttl{color:var(--amber)}

/* 研讨室卡片 */
.room{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px}
.room__no{font-weight:700;color:var(--green);font-size:1.1rem}
.room__special{display:inline-block;background:var(--blue);color:#fff;font-size:.78rem;padding:2px 8px;margin-left:8px}

/* Tab */
.tabs{display:flex;border-bottom:2px solid var(--green);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 22px;cursor:pointer;color:var(--text);font-weight:600;border:none;background:transparent;font-size:1rem;font-family:inherit}
.tab:hover{color:var(--green)}
.tab.active{background:var(--green);color:#fff}

/* 折叠面板（FAQ） */
.acc-item{border:1px solid var(--line);margin-bottom:10px;background:var(--card)}
.acc-head{padding:14px 18px;cursor:pointer;font-weight:600;color:var(--green);display:flex;justify-content:space-between;align-items:center}
.acc-head:hover{background:var(--bg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .25s}
.acc-body__inner{padding:0 18px 14px}

/* 登录页 */
.auth-wrap{max-width:440px;margin:0 auto}
.auth-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:32px}
.role-tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--green)}
.role-tab{flex:1;padding:10px 0;text-align:center;cursor:pointer;font-weight:600;color:var(--text);background:transparent;border:none;font-size:1rem;font-family:inherit}
.role-tab.active{background:var(--green);color:#fff}
.key-display{background:var(--bg);border:1px solid var(--line);padding:12px;text-align:center;margin-bottom:16px}
.key-display__num{font-family:Consolas,monospace;font-size:1.6rem;color:var(--green);font-weight:700;letter-spacing:4px}
.key-display__hint{font-size:.82rem;color:var(--muted)}

/* 空状态 / 提示 */
.empty-state{padding:32px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line)}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--blue);color:#fff;padding:12px 22px;font-size:.95rem;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast--warn{background:var(--st-out)}
.toast--error{background:var(--st-lost)}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(15,42,31,.55);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;max-width:440px;width:100%;padding:28px;border-top:4px solid var(--amber);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.modal h3{color:var(--green);margin:0 0 12px}
.modal p{margin:0 0 20px;color:var(--text)}
.modal .btn{width:100%}

/* 回到顶部 */
#to-top{position:fixed;right:22px;bottom:22px;width:46px;height:46px;background:var(--green);color:#fff;border:none;font-size:1.4rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:150}
#to-top:hover{background:var(--amber)}
#to-top.show{display:flex}

/* 页脚 */
.site-footer{background:var(--footerbg);color:var(--foottext);border-top:1px solid var(--green);margin-top:56px}
.site-footer .container{padding:32px 20px 20px}
.footer-cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;font-size:.85rem}
.footer-col h4{color:#fff;font-size:.92rem;margin:0 0 12px;font-weight:600}
.footer-col a{color:var(--foottext)}
.footer-col a:hover{color:var(--amber)}
.footer-col ul{list-style:none;margin:0;padding:0}
.footer-col li{margin-bottom:8px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:24px;padding-top:16px;font-size:.8rem;color:var(--foottext);text-align:center}

/* 响应式 */
@media(max-width:1023px){
  .nav-toggle{display:block}
  .main-nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--green);flex-direction:column;align-items:stretch;padding:8px 0;border-top:1px solid rgba(255,255,255,.15)}
  .main-nav.open{display:flex}
  .main-nav a{height:auto;padding:12px 20px}
  .main-nav a.active::after{display:none}
  .site-header{position:relative}
  .nav-login{display:none}
  .grid-3,.grid-4,.grid-6,.grid-8{grid-template-columns:repeat(2,1fr)}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .layout{flex-direction:column}
  .side{width:100%}
  .footer-cols{grid-template-columns:1fr 1fr}
}
@media(max-width:767px){
  .grid-2,.grid-3,.grid-4,.grid-6,.grid-8{grid-template-columns:1fr}
  .footer-cols{grid-template-columns:1fr}
  h1{font-size:1.8rem}
  .hero__title{font-size:2rem}
  .hero__search{flex-direction:column;gap:10px}
}
@media(max-width:860px){
  .home-cols{grid-template-columns:1fr}
}

/* ===== 图书详情页 ===== */
.book-detail{max-width:1200px}
.book-type-tag{display:inline-block;background:var(--blue);color:#fff;font-weight:600;font-size:.85rem;padding:4px 12px;letter-spacing:1px}
.book-detail__title{margin:12px 0 18px;font-size:2rem}
.book-actions{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);margin-bottom:22px}
.book-action{background:transparent;color:var(--green);border:none;border-bottom:2px solid transparent;padding:10px 16px;font-size:.95rem;cursor:pointer;font-family:inherit}
.book-action:hover{border-bottom-color:var(--amber)}
.book-action:focus{outline:none;border-bottom-color:var(--amber)}
.detail-table{width:100%;border-collapse:collapse;font-size:.98rem;margin-bottom:8px}
.detail-table th,.detail-table td{border:1px solid var(--line);padding:12px 16px;text-align:left;vertical-align:top}
.detail-table th{background:var(--bg);color:var(--green);font-weight:600;width:140px;white-space:nowrap}
.detail-table td{color:var(--text)}
.imp-notice{background:#FFF8E1;border:1px solid #FFE082;font-size:.85rem;padding:12px 16px;margin:22px 0;color:#6b5a00}
.imp-notice strong{color:#9a7b00}
.holding-card{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);margin-top:6px}
.holding-card__head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer}
.holding-card__head:hover{background:var(--bg)}
.holding-card__lib{font-weight:700;color:var(--green);font-size:1.05rem}
.holding-card__call{color:var(--muted);font-size:.92rem;margin-top:4px}
.holding-toggle{background:transparent;border:1px solid var(--line);color:var(--green);padding:6px 16px;cursor:pointer;font-family:inherit;font-size:.9rem;flex-shrink:0}
.holding-card__detail{overflow:hidden;max-height:0;opacity:0;transform:translateX(24px);transition:max-height .3s ease,opacity .3s ease,transform .3s ease;padding:0 18px}
.holding-card.open .holding-card__detail{max-height:260px;opacity:1;transform:translateX(0);padding:0 18px 18px}
.holding-card__row{color:var(--text);font-size:.92rem;margin-top:8px}
.request-login{background:var(--bg);font-size:.95rem;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.request-login span{flex:1;min-width:160px}

/* 详情页专用弹窗 */
.modal-lg{max-width:560px}
.modal__head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.modal__head h3{margin:0;color:var(--green)}
.modal__close{background:transparent;border:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
.modal__close:hover{color:var(--green)}
.export-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.export-grid .btn{font-size:.92rem;padding:10px 8px;width:100%}
.permalink-box{display:flex;gap:8px;margin-bottom:18px}
.permalink-box input{flex:1;font-size:.9rem;background:var(--bg)}
.cite-row{border-bottom:1px solid var(--line);padding:12px 0}
.cite-row:last-child{border-bottom:none}
.cite-row__name{font-weight:600;color:var(--green);font-size:.92rem;margin-bottom:4px}
.cite-row__text{font-size:.9rem;color:var(--text);margin-bottom:8px;word-break:break-word}
.cite-row__copy{font-size:.85rem;padding:4px 14px}
.qr-box{border:1px dashed var(--line);background:var(--bg);padding:18px;text-align:center;margin-bottom:14px}
.qr-box canvas{width:200px;height:200px;background:#fff;border:1px solid var(--line)}
.qr-note{font-size:.8rem;color:var(--muted);margin-top:10px}
.qr-link{display:flex;gap:8px;margin-top:8px}
.qr-link input{flex:1;font-size:.88rem;background:var(--bg)}
.email-field{margin-bottom:12px}
.email-field input,.email-field textarea{margin-bottom:0}
.email-field textarea{min-height:160px;font-family:inherit;line-height:1.6}
.link-list a{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.link-list a:last-child{border-bottom:none}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1;width:auto}
@media(max-width:520px){
  .export-grid{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>

<div id="app"></div>

   ========================================================= */

  /* ===================== 工具 ===================== */
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function getState() {
    try { var raw = sessionStorage.getItem('library_user'); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function setState(u) { try { sessionStorage.setItem('library_user', JSON.stringify(u)); } catch (e) {} }
  function clearState() { try { sessionStorage.removeItem('library_user'); } catch (e) {} }
  function isAdmin() { var u = getState(); return !!(u && u.role === 'admin'); }
  function roleLabel(r) { return r === 'admin' ? '管理员' : r === 'staff' ? '教职工' : r === 'student' ? '学生' : ''; }
  function statusTag(st) {
    switch (st) {
      case 'ok': return '<span class="tag tag-ok">可借</span>';
      case 'out': return '<span class="tag tag-out">已借出</span>';
      case 'lost': return '<span class="tag tag-lost">遗失</span>';
      case 'broken': return '<span class="tag tag-broken">破损</span>';
      case 'internal': return '<span class="tag tag-internal">内部阅览</span>';
      default: return '<span class="tag">' + esc(st) + '</span>';
    }
  }
  function tagByCn(s) {
    if (s === '遗失') return 'tag-lost';
    if (s === '破损') return 'tag-broken';
    if (s === '已借出') return 'tag-out';
    if (s === '公开') return 'tag-public';
    if (s === '内部') return 'tag-internal';
    if (s === '受限') return 'tag-restricted';
    return 'tag-ok';
  }

  function bookRow(b, showBorrower) {
    var extra = '';
    if (b.status === 'out' && b.returnDate) extra += '<div class="book__meta">预计归还：' + esc(b.returnDate) + '</div>';
    if (b.status === 'broken') extra += '<div class="book__meta"><a href="#/contact-damaged" data-nav="contact-damaged">联系馆员 →</a></div>';
    var borrower = '';
    if (showBorrower && b.borrower) borrower = '<div class="book__borrower">曾借阅者：' + esc(b.borrower) + '</div>';

        '<div class="book__author">' + esc(b.author) + '</div>' +
        '<div class="book__meta">' + esc(b.category) + ' · ' + esc(b.publisher) + ' · ' + esc(b.year) + ' · ' + esc(b.location) + '</div>' +
        '<div class="book__row">' + statusTag(b.status) + extra + borrower + '</div>' +
      '</div></div>';
  }

  /* ===================== 图书详情页 数据 / 工具 ===================== */
  function bookById(id) {
    for (var i = 0; i < BOOKS.length; i++) { if (BOOKS[i].id === id) return BOOKS[i]; }
    return null;
  }
  function deriveIsbn(b) {
    var seed = String(b.id).replace(/[^0-9]/g, '') || '0';
    var core = ('000000' + seed).slice(-6);
    var base = '9787' + core + '0';
    var sum = 0;
    for (var i = 0; i < 12; i++) { sum += parseInt(base.charAt(i), 10) * (i % 2 === 0 ? 1 : 3); }
    var cd = (10 - (sum % 10)) % 10;
    return base + cd;
  }
  function deriveCallNo(b) {
    var map = { '古籍': 'PL', '古籍特藏': 'PL', '图书': 'PL', '期刊': 'AP', '电子资源': 'ER' };
    var p = map[b.category] || 'PL';
    var yr = String(b.year || '----');
    var auth = (b.author || '佚名').charAt(0);
    return p + ' ' + yr + ' .' + auth;
  }
  function holdingStatus(b) {
    if (b.status === 'ok') return '在架';
    if (b.status === 'out') return '已借出';
    if (b.status === 'lost') return '遗失';
    if (b.status === 'broken') return '破损';
    return '内部阅览';
  }
  function holdingTag(st) {
    var cls = ({ '在架': 'tag-ok', '已借出': 'tag-out', '遗失': 'tag-lost', '破损': 'tag-broken', '内部阅览': 'tag-internal' })[st] || 'tag-ok';
    return '<span class="tag ' + cls + '">' + esc(st) + '</span>';
  }
  function compileBook(b) {
    if (!b) return null;
    var st = holdingStatus(b);
    return {
      id: b.id, title: b.title, otherTitle: b.otherTitle || '', author: b.author,
      responsible: b.responsible || b.author, subject: b.subject || b.category,
      series: b.series || '', publisher: b.publisher, year: b.year,
      isbn: b.isbn || deriveIsbn(b), version: b.version || '初版',
      format: b.format || '纸质图书', language: b.language || '中文',
      callNo: b.callNo || deriveCallNo(b), holdingLoc: b.location,
      holdingDesc: b.holding || 'MMW Book (4/F)',
      copies: 1, available: (b.status === 'ok') ? 1 : 0, reservations: (b.status === 'out') ? 1 : 0,
      status: st, permalink: 'https://library.jcu.edu.cn/book/' + (b.permalinkId || b.id),
      borrower: b.borrower
    };
  }
  function citations(d) {
    var a = d.author, t = d.title, p = d.publisher, y = d.year, loc = d.holdingLoc;
    return [
      { name: 'APA (第7版)', text: a + '. (' + y + '). ' + t + ' (' + d.version + '). ' + p + '.' },
      { name: 'APA (第6版)', text: a + '. (' + y + '). ' + t + '. ' + p + '.' },
      { name: 'Chicago/Turabian (第18版)', text: a + '. ' + t + '. ' + loc + ': ' + p + ', ' + y + '.' },
      { name: 'MLA (第9版)', text: a + '. ' + t + '. ' + p + ', ' + y + '.' },
      { name: '哈佛格式', text: a + ' (' + y + '). ' + t + '. ' + p + '.' }
    ];
  }

  function openModal(title, bodyHtml) {

    mask.addEventListener('click', function (e) { if (e.target === mask) removeModal(mask); });
    mask.querySelector('.modal__close').addEventListener('click', function () { removeModal(mask); });
    requestAnimationFrame(function () { mask.classList.add('show'); });
    return mask;
  }
  function removeModal(mask) { if (mask && mask.parentNode) mask.parentNode.removeChild(mask); }

  function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板'); }, function () { fallbackCopy(text); });
        return;
      }
    } catch (e) {}
    fallbackCopy(text);
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('已复制到剪贴板');
    } catch (e) { toast('复制失败', 'error'); }
  }
  function downloadText(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) { toast('下载失败', 'error'); }
  }
  function buildRIS(d) {
    return [
      'TY  - BOOK', 'TI  - ' + d.title, 'AU  - ' + d.author, 'PY  - ' + d.year,
      'PB  - ' + d.publisher, 'SN  - ' + d.isbn, 'LA  - ' + d.language,
      'CN  - ' + d.subject, 'UR  - ' + d.permalink, 'ER  - '
    ].join('\r\n');
  }
  function buildCSV(d) {
    var header = ['题名', '作者', '出版社', '出版日期', 'ISBN', '索书号', '馆藏地', '语言'];
    var row = [d.title, d.author, d.publisher, d.year, d.isbn, d.callNo, d.holdingLoc, d.language];
    function csv(s) { s = String(s == null ? '' : s); if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"'; return s; }
    return '﻿' + header.join(',') + '\n' + row.map(csv).join(',');
  }
  function buildExcel(d) { return buildCSV(d); }

  function drawQrPlaceholder(canvas, text) {
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var n = 25, size = 200, cell = size / n;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    var seed = 2166136261 >>> 0;
    for (var i = 0; i < text.length; i++) { seed ^= text.charCodeAt(i); seed = (seed * 16777619) >>> 0; }
    function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
    function inFinder(x, y) { return (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8); }
    ctx.fillStyle = '#111';
    for (var y = 0; y < n; y++) { for (var x = 0; x < n; x++) { if (inFinder(x, y)) continue; if (rnd() > 0.5) ctx.fillRect(Math.round(x * cell), Math.round(y * cell), Math.ceil(cell), Math.ceil(cell)); } }
    function finder(ox, oy) { ctx.fillStyle = '#111'; ctx.fillRect(ox, oy, 7 * cell, 7 * cell); ctx.fillStyle = '#fff'; ctx.fillRect(ox + cell, oy + cell, 5 * cell, 5 * cell); ctx.fillStyle = '#111'; ctx.fillRect(ox + 2 * cell, oy + 2 * cell, 3 * cell, 3 * cell); }
    finder(0, 0); finder((n - 7) * cell, 0); finder(0, (n - 7) * cell);
  }

      if (b.hidden) return false;

  function advancedSearch(f) {
    var allFilled = f.title && f.author && f.category && f.publisher && f.year && (f.location && f.location !== '全部');
    if (allFilled) {
      return BOOKS.filter(function (b) {
        return String(b.title) === f.title &&
               String(b.author) === f.author &&
               String(b.category) === f.category &&
               String(b.publisher) === f.publisher &&
               String(b.year) === f.year &&
               String(b.location) === f.location;
      });
    }
    return BOOKS.filter(function (b) {
      if (b.hidden) return false;
      if (f.title && b.title.toLowerCase().indexOf(f.title.toLowerCase()) < 0) return false;
      if (f.author && b.author.toLowerCase().indexOf(f.author.toLowerCase()) < 0) return false;
      if (f.category && b.category.toLowerCase().indexOf(f.category.toLowerCase()) < 0) return false;
      if (f.publisher && b.publisher.toLowerCase().indexOf(f.publisher.toLowerCase()) < 0) return false;
      if (f.year && String(b.year).indexOf(f.year) < 0) return false;
      if (f.location && f.location !== '全部' && b.location !== f.location) return false;
      var any = f.title || f.author || f.category || f.publisher || f.year || (f.location && f.location !== '全部');

  /* ===================== 渲染 ===================== */
  function pageBody(key, query) {
    var p = PAGES[key];
    if (p) return p(query);
    return '<main class="container"><div class="empty-state">页面不存在。</div></main>';
  }

  var app = null;
  function render(key, query) {
    if (ALIAS[key]) key = ALIAS[key];
    key = PAGES[key] ? key : 'index';
    app = app || document.getElementById('app');
    var meta = META[key] || { title: key, crumbs: ['首页'] };
    if (key === 'book') {
      var _bb = bookById(query && query.id);
      if (_bb) { meta = { title: _bb.title, crumbs: ['首页', '馆藏资源', '检索结果', _bb.title] }; }
    }
    var group = GROUP_OF[key];
    var body = pageBody(key, query);
    document.title = meta.title + ' - 江川大学图书馆';
    var html = renderHeader(key) + renderBreadcrumb(meta.crumbs);
    if (group && !isTopLevel(key) && key !== 'book') {
      html += '<div class="container"><div class="layout">' + renderSidebar(key, group) + '<div class="content">' + body + '</div></div></div>';
    } else {
      html += body;
    }
    html += renderFooter();
    app.innerHTML = html;
    closeAllModals();
    closeModal();
    bindPage(key);
    window.scrollTo(0, 0);
  }

  function isTopLevel(key) {
    // 一级落地页本身不需要包裹侧栏（index 单独处理，其余一级栏目页也进侧栏以展示子项）
    return false;
  }

  /* ===================== 交互绑定 ===================== */
  function bindPage(key) {
    var u = getState();

    // 导航高亮已由 renderHeader 处理

    // 首页 hero 检索
    var heroQ = $('#hero-q');
    var heroBtn = $('#hero-search');
    if (heroQ && heroBtn) {
      heroBtn.addEventListener('click', function () { goSearch(heroQ.value); });
      heroQ.addEventListener('keydown', function (e) { if (e.key === 'Enter') goSearch(heroQ.value); });
    }

    // 馆藏检索
    if (key === 'collection') bindCollection();

    // 检索结果页
    if (key === 'collection-search') bindSearch();

    // 高级检索
    if (key === 'collection-advanced') bindAdvanced();

    // 特藏
    if (key === 'special-collection') bindSpecial();

    // 预约
    if (key === 'booking') bindBooking();

    // 图书预约（reserve）
    if (key === 'borrowing-reserve') bindReserve();

    // 荐购
    if (key === 'borrowing-recommend') bindRecommend();

    // 反馈
    if (key === 'contact-feedback') bindFeedback();

    // 登录
    if (key === 'login') bindLogin();

    // 我的图书馆
    if (key === 'my-library') bindMyLibrary();

    // FAQ 折叠
    if (key === 'contact-faq') bindAccordion();

    // 图书详情
    if (key === 'book') bindBook();
  }

  function goSearch(q) {
    navigate('collection-search', { q: q });
  }

  function bindCollection() {
    var results = $('#results');
    var qInput = $('#coll-q');
    var chips = $all('.chip');
    var curCat = '全部';
    var locFilters = {}; var statFilters = {};
    function render() {
      var q = qInput ? qInput.value : '';
      var list = normalSearch(q).filter(function (b) {
        if (curCat !== '全部' && b.category !== curCat) return false;
        var locOn = Object.keys(locFilters).some(function (k) { return locFilters[k]; });
        if (locOn && !locFilters[b.location]) return false;
        var statOn = Object.keys(statFilters).some(function (k) { return statFilters[k]; });
        if (statOn && !statFilters[b.status]) return false;
        return true;
      });
      renderBookList(results, list, isAdmin());
      var rc = $('#result-count'); if (rc) rc.textContent = '共找到 ' + list.length + ' 条结果';
    }
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        chips.forEach(function (x) { x.classList.remove('active'); x.classList.add('btn-ghost'); });
        c.classList.add('active'); c.classList.remove('btn-ghost');
        curCat = c.getAttribute('data-cat');
        render();
      });
    });
    $all('input[data-floc]').forEach(function (inp) {
      inp.addEventListener('change', function () { locFilters[inp.getAttribute('data-floc')] = inp.checked; render(); });
    });
    $all('input[data-fstat]').forEach(function (inp) {
      inp.addEventListener('change', function () { statFilters[inp.getAttribute('data-fstat')] = inp.checked; render(); });
    });
    if (qInput) qInput.addEventListener('input', render);
    render();
  }

  function bindSearch() {
    var input = $('#search-q');
    var btn = $('#search-go');
    if (btn && input) {
      btn.addEventListener('click', function () { goSearch(input.value); });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') goSearch(input.value); });
    }
  }

  function bindAdvanced() {
    var form = $('#adv-form');
    if (!form) return;
    var results = $('#results');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      function val(n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; }
      var f = { title: val('booktitle'), author: val('author'), category: val('category'), publisher: val('publisher'), year: val('year'), location: val('location') };
      var any = f.title || f.author || f.category || f.publisher || f.year || (f.location && f.location !== '全部');
      if (!any) { toast('请至少填写一项检索条件', 'warn'); return; }
      var list = advancedSearch(f);
      renderBookList(results, list, isAdmin());
      var rc = $('#result-count'); if (rc) rc.textContent = list.length ? '共找到 ' + list.length + ' 条结果' : '';
    });
  }

  function bindSpecial() {
    $all('.special-item.locked').forEach(function (el) {
      el.addEventListener('click', function () { toast('该卷宗需申请调阅', 'warn'); });
    });
  }

  function bindBooking() {
    var form = $('#booking-form');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        showModal('预约系统升级维护中', '预约系统正在升级维护，暂不支持新提交预约。<br>历史预约记录请登录【我的图书馆】查阅。');
      });
    }
  }

  function bindReserve() {
    var btn = $('#reserve-search');
    var input = $('#reserve-title');
    var out = $('#reserve-result');
    if (btn && input && out) {
      btn.addEventListener('click', function () {
        var t = input.value.trim();
        if (!t) { out.innerHTML = '<span style="color:var(--st-lost)">请输入书名。</span>'; return; }
        var found = BOOKS.filter(function (b) { return !b.hidden && b.title.toLowerCase().indexOf(t.toLowerCase()) >= 0; });
        if (found.length && found[0].status === 'ok') {
          out.innerHTML = '<span style="color:var(--st-ok)">该书可预约。</span> <button class="btn btn-sm" id="do-reserve">预约此书</button>';
          var dr = $('#do-reserve'); if (dr) dr.addEventListener('click', function () { toast('预约成功'); });
        } else if (found.length) {
          out.innerHTML = '<span style="color:var(--st-out)">该书已被预约 / 暂不可预约。</span>';
        } else {
          out.innerHTML = '<span style="color:var(--st-lost)">未找到该书。</span>';
        }
      });
    }
  }

  function bindRecommend() {
    var form = $('#recommend-form');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = true;
      $all('.field', form).forEach(function (f) {
        var inp = f.querySelector('input,textarea');
        if (!inp) return;
        if (inp.name === 'title' || inp.name === 'requester') {
          if (!inp.value.trim()) { f.classList.add('invalid'); ok = false; } else f.classList.remove('invalid');
        }
      });
      if (!ok) return;
      toast('推荐已提交');
      form.reset();
    });
  }

  function bindFeedback() {
    var form = $('#feedback-form');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = true;
      $all('.field', form).forEach(function (f) {
        var inp = f.querySelector('input,textarea,select');
        if (!inp) return;
        var v = inp.value.trim();
        var bad = !v;
        if (inp.type === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) bad = true;
        if (bad) { f.classList.add('invalid'); ok = false; } else f.classList.remove('invalid');
      });
      if (!ok) return;
      showModal('提交成功', '感谢您的反馈！');
      form.reset();
    });
  }

  var keyTimer = null;
  function bindLogin() {
    startDynamicKey();
    var form = $('#login-form');
    if (!form) return;
    var roleTabs = $all('.role-tab');
    var keyField = $('#key-field');
    var pwdField = $('#pwd-field');
    var curRole = 'student';
    function syncRole(r) {
      curRole = r;
      roleTabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-role') === r); });
      if (keyField) keyField.style.display = (r === 'admin') ? '' : 'none';
      if (pwdField) pwdField.style.display = (r === 'admin') ? 'none' : '';
    }
    roleTabs.forEach(function (t) { t.addEventListener('click', function () { syncRole(t.getAttribute('data-role')); }); });
    syncRole('student');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = form.querySelector('[name="uid"]').value.trim();
      var pwd = form.querySelector('[name="pwd"]').value;
      var keyEl = form.querySelector('[name="key"]');
      var key = keyEl ? keyEl.value.trim() : '';
      if (curRole === 'admin') {
        if (id !== 'admin') { toast('管理员账号不正确', 'error'); return; }
        if (key !== ADMIN_KEY) { toast('动态密钥不正确', 'error'); return; }
        setState({ id: 'admin', name: '系统管理员', role: 'admin' });
        navigate('my-library');
        return;
      }
      var acc = ACCOUNTS[id];
      if (!acc || acc.role !== curRole) { toast('账号或角色不正确', 'error'); return; }
      if (acc.pwd !== pwd) { toast('密码不正确', 'error'); return; }
      setState({ id: acc.id, name: acc.name, role: acc.role });
      navigate('my-library');
    });
  }

  function startDynamicKey() {
    var keyEl = $('#admin-key');
    if (!keyEl) return;
    if (keyTimer) clearInterval(keyTimer);
    function tick() {
      keyEl.textContent = ADMIN_KEY;
      var cdEl = $('#key-countdown');
      if (cdEl) { var s = new Date().getSeconds(); var remain = 30 - (s % 30); cdEl.textContent = remain + ' 秒后刷新'; }
    }
    tick();
    keyTimer = setInterval(tick, 1000);
  }

  function bindMyLibrary() {
    var btn = $('#btn-logout');
    if (btn) btn.addEventListener('click', function () { clearState(); navigate('index'); });
    $all('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        $all('.tab').forEach(function (t) { t.classList.remove('active'); });
        $all('.tab-panel').forEach(function (p) { p.style.display = 'none'; });
        tab.classList.add('active');
        var pid = tab.getAttribute('data-panel');
        var p = document.getElementById(pid);
        if (p) p.style.display = '';
      });
    });
  }

  function bindAccordion() {
    $all('.acc-item').forEach(function (item) {
      var head = item.querySelector('.acc-head');
      if (!head) return;
      var body = item.querySelector('.acc-body');
      head.addEventListener('click', function () {
        var open = item.classList.toggle('open');
        body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
        var sign = head.querySelector('span'); if (sign) sign.textContent = open ? '－' : '＋';
      });
    });
  }

  function bindBook() {
    var ph = parseHash();
    var d = compileBook(bookById(ph.query && ph.query.id));
    if (!d) return;
    var top = $('#act-top'); if (top) top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var exp = $('#act-export'); if (exp) exp.addEventListener('click', function () { openExportModal(d); });
    var hold = $('#act-holding'); if (hold) hold.addEventListener('click', function () { var el = $('#holding-section'); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
    var det = $('#act-detail'); if (det) det.addEventListener('click', function () { var el = $('#detail-info'); if (el) el.style.display = (el.style.display === 'none') ? '' : 'none'; });
    var lnk = $('#act-links'); if (lnk) lnk.addEventListener('click', function () { openLinksModal(d); });
    var qr = $('#act-qr'); if (qr) qr.addEventListener('click', function () { openQrModal(d); });
    var card = $('#holding-card');
    if (card) {
      var head = card.querySelector('.holding-card__head');
      (head || card).addEventListener('click', function () {
        var open = card.classList.toggle('open');
        var tog = $('#holding-toggle'); if (tog) tog.textContent = open ? '收起 ▾' : '展开 ▸';
      });
    }
    var login = $('#book-login'); if (login) login.addEventListener('click', function (e) { e.preventDefault(); navigate('login'); });
  }

  /* ===================== 路由 ===================== */
  function parseHash() {
    var h = location.hash || '';
    var s = h.replace(/^#\/?/, '');
    var q = null;
    var qi = s.indexOf('?');
    if (qi >= 0) {
      var qs = s.slice(qi + 1);
      s = s.slice(0, qi);
      q = {};
      qs.split('&').forEach(function (kv) {
        var p = kv.split('='); if (p.length === 2) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1]);
      });
    }
    return { key: s || 'index', query: q };
  }

  function navigate(key, query) {
    if (ALIAS[key]) key = ALIAS[key];
    var url = '#/' + key;
    if (query) {
      var parts = [];
      for (var k in query) { if (query.hasOwnProperty(k) && query[k] != null && query[k] !== '') parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k])); }
      if (parts.length) url += '?' + parts.join('&');
    }
    history.pushState({ key: key, query: query || null }, '', url);
    render(key, query);
  }

  // 暴露导航钩子（供测试与调试）
  window.__nav = navigate;

  window.addEventListener('popstate', function (e) {
    var s = e.state || parseHash();
    render(s.key, s.query);
  });

  // 事件委托：导航链接 / 导航开关 / 回到顶部
  document.addEventListener('click', function (e) {
    var nav = e.target.closest ? e.target.closest('a[data-nav]') : null;
    if (nav) {
      e.preventDefault();
      var k = nav.getAttribute('data-nav');
      var idAttr = nav.getAttribute('data-id');
      if (idAttr) { navigate(k, { id: idAttr }); }
      else { navigate(k, null); }
      return;
    }
    if (e.target.closest && e.target.closest('#nav-toggle')) {
      var m = $('#main-nav'); if (m) m.classList.toggle('open');
      return;
    }
    if (e.target.closest && e.target.closest('#to-top')) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  });

  // 回到顶部按钮
  function initToTop() {
    var btn = $('#to-top');
    if (!btn) return;
    window.addEventListener('scroll', function () {
      btn.classList.toggle('show', window.scrollY > 400);
    });
  }

  /* ===================== 启动 ===================== */
  var initial = parseHash();
  render(initial.key, initial.query);
  initToTop();
})();

</script>
</body>
</html>
