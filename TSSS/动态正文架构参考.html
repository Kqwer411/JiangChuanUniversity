<!-- 正文主体容器（通常位于内容页中部） -->
<div class="art-main">

    <!-- 文章标题及元信息区 -->
    <div class="art-tit cont-tit d">
        <!-- 主标题，可自定义颜色/加粗 -->
        <h3 style="font-weight:bold;color:#f54818;">文章标题</h3>
        
        <!-- 副标题（如有） -->
        <h4></h4>

        <!-- 元信息：作者、审核、日期、来源等 -->
        <p>
            <span>作者：xxx</span>
            <span>审核人：xxx</span>
            <span>发布日期：xxxx-xx-xx</span>
            <span>浏览次数：xxx</span>
            <span>来源：xxx</span>
            <span>审核：xxx</span>
            <span>编辑：xxx</span>
        </p>
    </div>

    <!-- 正文内容区 -->
    <div id="vsb_content_2" class="art-body d">
        <div class="v_news_content">
            <!-- 正文首段 -->
            <p class="vsbcontent_start">首段内容…</p>
            
            <!-- 正文其他段落（可多个普通p标签） -->
            <p>正文段落…</p>
            
            <!-- 正文末段 -->
            <p class="vsbcontent_end">末段内容…</p>
            
            <!-- 正文配图 -->
            <p class="vsbcontent_img">
                <img src="图片地址" width="600" alt="">
            </p>
        </div>
    </div>

    <!-- 投票或附加功能占位（按需保留） -->
    <div id="div_vote_id"></div>

    <!-- 文章底部翻页/链接区 -->
    <div class="art-info">
        <div class="pnext">
            <!-- 上一条（无则留空） -->
            <p></p>
            <!-- 下一条 -->
            <p>下一条：<a href="链接地址">下一条标题</a></p>
        </div>
    </div>
</div>
